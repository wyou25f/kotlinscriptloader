# Server language: ru, en, or the filename of a custom locale in plugins/KotlinScriptLoader/locale/.
language: ru

sandbox: false

discord:
  webhooks:
    general: ""
    admin: ""
    logs: ""

# База данных KSL (persist, table(), доступ из скриптов через database).
#   sqlite  - файл plugins/KotlinScriptLoader/ksl.db, ничего настраивать не нужно (по умолчанию)
#   mysql / mariadb - внешний сервер; таблицы ksl_* KSL создаст сам при первом запуске.
#   postgresql - внешний PostgreSQL; таблицы ksl_* и версия схемы создаются автоматически.
# Remote SQL backends use verified TLS by default. Set port: 0 to select the backend's standard port.
# Рекомендуется хранить пароль в переменной окружения KSL_DB_PASSWORD.
database:
  type: sqlite
  host: localhost
  port: 0
  name: ksl
  user: ""
  password: ""
  # Remote databases verify the server certificate and hostname by default.
  # PostgreSQL: disable | allow | prefer | require | verify-ca | verify-full
  # MySQL/MariaDB: disable | trust | verify-ca | verify-full
  # Non-verifying modes require allow-insecure-transport: true.
  ssl-mode: verify-full
  allow-insecure-transport: false
  pool-size: 4
  # Maximum JDBC execution time, returned rows and rows in one prepared batch.
  query-timeout-seconds: 10
  query-max-rows: 10000
  max-batch-rows: 1000
  # Кэш значений table() в памяти. По умолчанию: sqlite - включён, удалённые БД - выключен
  # (данные могут менять другие серверы или вы сами в phpMyAdmin). Очищается при /ksl reload.
  # cache: true

# Папки со скриптами и перезагрузка.
# Worker pool KSL для CPU-heavy/background задач из скриптов.
# Число потоков ограничивает конкуренцию KSL, но не закрепляет их за физическими ядрами.
runtime:
  # 0 = auto: KSL selects a conservative worker count from the JVM heap and CPU count.
  # Set 1-64 to override the automatic choice.
  cpu-threads: 0
  # 0 = auto: queue capacity scales with the maximum JVM heap; positive values override it.
  queue-capacity: 0
  max-tasks-per-script: 64
  # Останавливать периодическую задачу после такого числа последовательных ошибок (1-20).
  task-failure-limit: 3

scripts:
  # Искать скрипты и в подпапках scripts/ (папки и файлы, начинающиеся с "." , и папки с "_" пропускаются).
  # Имя скрипта = путь внутри scripts/ без .kts, например economy/shop.
  recursive: true
  # Сам перезагружает скрипт при сохранении файла (удобно при разработке; на боевом сервере лучше выключить).
  auto-reload: false
  # Сколько скриптов компилировать одновременно при перезагрузке (1-8). 1 безопасно по умолчанию;
  # больше ускоряет перезагрузку многих скриптов, но нагружает процессор.
  compile-threads: 1
  # Максимум успешно скомпилированных скриптов в LRU-кеше (16-2048).
  # 0 = автоматический размер по памяти JVM/хоста; кеш дополнительно уменьшается при высоком heap.
  # Положительное значение отключает автоуменьшение и задаёт явный лимит.
  compile-cache-size: 0
  # async - скрипты загружаются в фоне сразу после старта сервера (старт не задерживается компиляцией,
  #         а аддоны уже включены и их импорты доступны скриптам); sync - загрузка до конца старта плагина.
  startup-load: async

# Свои @плейсхолдеры@ для message()/richMessage()/messageList() в скриптах.
# Например server_name: "Мой сервер" даёт @server_name@. Встроенные имена
# (player, world, online, maxplayers, health, ping) занять нельзя.
# Динамические (зависящие от игрока) регистрируются из скрипта: textPlaceholder("rank") { player -> ... }
text-placeholders: {}
#  server_name: "Мой сервер"

# Безопасность скриптов. Подробности и честные границы: docs/Security-and-Sandbox.md
# Сам sandbox включается ключом sandbox: true в начале файла.
security:
  # strict - текстовый фильтр + запрет классов: скрипт не сможет загрузить Runtime, ProcessBuilder,
  #          рефлексию, ClassLoader и т.п. (обойти конкатенацией строк нельзя; проверка: /ksl doctor)
  # text   - только текстовый фильтр по исходнику
  sandbox-level: strict
  # Скрипты, на которые sandbox не действует (имена как в /ksl reload, например economy/shop)
  sandbox-trusted: []
  # Exact script ids allowed to use bounded SQL methods while sandboxed. Raw JDBC stays blocked.
  sandbox-database-allowlist: []
  # Дополнительные запрещённые фрагменты текста / разрешённые из списка по умолчанию
  sandbox-extra-forbidden: []
  sandbox-allowed: []
  # Дополнительные запрещённые классы (точное имя или пакет с точкой на конце: com.example.) / разрешённые
  class-deny-extra: []
  class-deny-allowed: []
  # Консольные команды, которые executeConsole() выполнять не будет (по умолчанию как ниже)
  console-command-blocklist: [op, deop, stop, restart, reload, rl]
  # Песочница не получает права консоли. Разрешай только конкретные команды, если это необходимо.
  sandbox-console-allowlist: []
  limits:
    # Сколько обработчиков событий и активных задач может создать один скрипт. Защита от скрипта,
    # который регистрирует их в цикле или внутри события.
    max-listeners-per-script: 500
    max-tasks-per-script: 2000

# Как KSL сообщает о проблемах в скриптах.
logging:
  # Minimum level enforced by the server for all script/addon loggers.
  # A logger in code may request a stricter level, but cannot lower this server minimum.
  default-level: INFO
  # Optional per-owner minimum levels. Keys: "script:<script-id>" or "addon:<addon-id>".
  # Example:
  # owner-levels:
  #   "script:economy/shop": DEBUG
  #   "addon:example-addon": TRACE
  owner-levels: {}
  # Maximum rendered KSL logger message length (128-16384).
  max-message-length: 4096
  # true - script failures are yellow (WARN); false - red (ERROR).
  script-errors-as-warnings: true

notifications:
  # Коротко писать в чат игрокам с правом ksl.admin, когда скрипт не загрузился после перезагрузки
  admins-in-game: true

# Диагностика долгих остановок главного потока (до срабатывания Paper Watchdog).
# Дамп помогает найти поток/плагин/скрипт, который задержал сервер; сам Paper Watchdog не отключается.
diagnostics:
  watchdog:
    enabled: true
    # Создать дамп, если главный поток не делает тики столько секунд. По умолчанию 5,
    # чтобы успеть записать его до стандартного таймаута Paper.
    threshold-seconds: 5
    # Частота проверки зависания отдельным daemon-потоком.
    poll-interval-ms: 500
    # Сколько снимков зависших потоков собрать в одном отчёте (1-5).
    snapshot-count: 3
    # Интервал между снимками: помогает увидеть, какой stack frame не меняется.
    snapshot-interval-ms: 750
    # Сколько последних дампов KSL хранить.
    max-dumps: 10


# Optional MCP Streamable HTTP management endpoint.
# Disabled by default. Loopback-only; requires KSL_MCP_TOKEN in the Paper process environment.
# Scripts and other plugins share the same JVM and may be able to read environment variables.
mcp:
  enabled: false
  bind: "127.0.0.1"
  port: 8765
  path: "/mcp"
  token-env: "KSL_MCP_TOKEN"
  # Exact origins only. Browser CORS/preflight is not enabled; native local MCP clients are expected.
  allowed-origins: []
  # Exposes a state-changing tool that executes one existing .kts script. Keep disabled by default.
  allow-script-reload: false
