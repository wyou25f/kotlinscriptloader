sandbox: false

discord:
  webhooks:
    general: ""
    admin: ""
    logs: ""

# База данных KSL (persist, table(), доступ из скриптов через database).
#   sqlite  - файл plugins/KotlinScriptLoader/ksl.db, ничего настраивать не нужно (по умолчанию)
#   mysql / mariadb - внешний сервер; базу и пользователя создай в phpMyAdmin (кодировка utf8mb4),
#                     таблицы ksl_* KSL создаст сам при первом запуске. Нужны MySQL 5.7+ или MariaDB 10.2+.
# Пароль хранится здесь открытым текстом - не выкладывай этот файл в репозиторий.
database:
  type: sqlite
  host: localhost
  port: 3306
  name: ksl
  user: ""
  password: ""
  # disable | trust | verify-ca | verify-full
  ssl-mode: disable
  pool-size: 4
  # Кэш значений table() в памяти. По умолчанию: sqlite - включён, mysql/mariadb - выключен
  # (данные могут менять другие серверы или вы сами в phpMyAdmin). Очищается при /ksl reload.
  # cache: true

# Папки со скриптами и перезагрузка.
# Worker pool KSL для CPU-heavy/background задач из скриптов.
# Число потоков ограничивает конкуренцию KSL, но не закрепляет их за физическими ядрами.
runtime:
  cpu-threads: 2
  queue-capacity: 256
  max-tasks-per-script: 64
  # Останавливать периодическую задачу после такого числа последовательных ошибок (1-20).
  task-failure-limit: 3

scripts:
  # Искать скрипты и в подпапках scripts/ (папки и файлы, начинающиеся с "." , и папки с "_" пропускаются).
  # Имя скрипта = путь внутри scripts/ без .kts, например economy/shop.
  recursive: true
  # Сам перезагружает скрипт при сохранении файла (удобно при разработке; на боевом сервере лучше выключить).
  auto-reload: false
  # Сколько скриптов компилировать одновременно при перезагрузке (1-8). 1 безопасно по умолчанию;
  # больше ускоряет перезагрузку многих скриптов, но нагружает процессор.
  compile-threads: 1
  # async - скрипты загружаются в фоне сразу после старта сервера (старт не задерживается компиляцией,
  #         а аддоны уже включены и их импорты доступны скриптам); sync - загрузка до конца старта плагина.
  startup-load: async

# Свои @плейсхолдеры@ для message()/richMessage()/messageList() в скриптах.
# Например server_name: "Мой сервер" даёт @server_name@. Встроенные имена
# (player, world, online, maxplayers, health, ping) занять нельзя.
# Динамические (зависящие от игрока) регистрируются из скрипта: textPlaceholder("rank") { player -> ... }
text-placeholders: {}
#  server_name: "Мой сервер"

# Безопасность скриптов. Подробности и честные границы: docs/Security-and-Sandbox.md
# Сам sandbox включается ключом sandbox: true в начале файла.
security:
  # strict - текстовый фильтр + запрет классов: скрипт не сможет загрузить Runtime, ProcessBuilder,
  #          рефлексию, ClassLoader и т.п. (обойти конкатенацией строк нельзя; проверка: /ksl doctor)
  # text   - только текстовый фильтр по исходнику
  sandbox-level: strict
  # Скрипты, на которые sandbox не действует (имена как в /ksl reload, например economy/shop)
  sandbox-trusted: []
  # Дополнительные запрещённые фрагменты текста / разрешённые из списка по умолчанию
  sandbox-extra-forbidden: []
  sandbox-allowed: []
  # Дополнительные запрещённые классы (точное имя или пакет с точкой на конце: com.example.) / разрешённые
  class-deny-extra: []
  class-deny-allowed: []
  # Консольные команды, которые executeConsole() выполнять не будет (по умолчанию как ниже)
  console-command-blocklist: [op, deop, stop, restart, reload, rl]
  limits:
    # Сколько обработчиков событий и активных задач может создать один скрипт. Защита от скрипта,
    # который регистрирует их в цикле или внутри события.
    max-listeners-per-script: 500
    max-tasks-per-script: 2000

# Как KSL сообщает о проблемах в скриптах.
logging:
  # true - ошибки скриптов жёлтые (WARN): это дело автора скрипта, а не поломка сервера; false - красные (ERROR)
  script-errors-as-warnings: true

notifications:
  # Коротко писать в чат игрокам с правом ksl.admin, когда скрипт не загрузился после перезагрузки
  admins-in-game: true

# Диагностика долгих остановок главного потока (до срабатывания Paper Watchdog).
# Дамп помогает найти поток/плагин/скрипт, который задержал сервер; сам Paper Watchdog не отключается.
diagnostics:
  watchdog:
    enabled: true
    # Создать дамп, если главный поток не делает тики столько секунд. По умолчанию 5,
    # чтобы успеть записать его до стандартного таймаута Paper.
    threshold-seconds: 5
    # Частота проверки зависания отдельным daemon-потоком.
    poll-interval-ms: 500
    # Сколько последних дампов KSL хранить.
    max-dumps: 10
