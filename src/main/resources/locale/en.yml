# Built-in English locale for KotlinScriptLoader.
# Keep the keys and {placeholders} unchanged in custom locale files.
command:
  no-permission: "§cYou do not have permission. Required: ksl.admin"

language:
  current: "§aCurrent KSL language: §f{language}"
  available: "§7Available languages: §f{languages}"
  usage: "§7Usage: §f/ksl language <ru|en|custom>"
  changed: "§aKSL language changed to §f{language}§a."
  invalid: "§cLanguage '{language}' is unavailable. Add locale/{language}.yml or choose one of: {available}"

reload:
  busy: "§eA reload is already running. Please wait a moment."
  all:
    start: "§7Validating and reloading all scripts in the background..."
    done: "{color}✔ Reload complete: {loaded} script(s) loaded, {failed} failed."
  changed:
    done: "{color}✔ Changed-script reload: {reloaded} reloaded, {unloaded} unloaded, {unchanged} unchanged, {failed} failed."
  folder:
    start: "§7Reloading scripts in folder '{folder}'..."
    empty: "§eNo scripts were found in folder '{folder}'."
    done: "{color}✔ Folder '{folder}': {loaded} script(s) loaded, {failed} failed."
  script:
    start: "§7Reloading script '{script}'..."
    done: "§a✔ Script '{script}' loaded successfully."
    failed: "§cScript '{script}' could not be loaded. See the console or /ksl errors."

runtime:
  title: "§9§lKSL §7— runtime diagnostics:"
  heap: "§7Heap: §f{used} §7/ §f{max} §8| committed: {committed}"
  nonheap: "§7Non-heap: §f{nonheap} §8| §7CPU: §f{processors} §8| process: §f{process} §8| system: §f{system}"
  threads: "§7JVM threads: §f{threads} §8(daemon: {daemon}) §7| GC: §f{gc} §8({gc-ms} ms)"
  pool: "§bWorker pool §8— §f{workers} thread(s), active={active}, queued={queued}, tracked={tracked}"
  tasks: "§7Completed: §f{completed} §8| §7rejected: §f{rejected}"
  setting: "§7Setting: §f/ksl runtime workers <1-64>"
  heap-note: "§8Heap size is configured by the JVM with -Xms/-Xmx; KSL does not force garbage collection."
  workers:
    usage: "§eUsage: §f/ksl runtime workers <1-64>"
    changed: "§aWorker pool size set to {count} thread(s). Saved to config.yml."

scripts:
  empty: "§eNo scripts were found."
  title: "§9§lKSL §7— loaded scripts: {loaded}/{total}"
  entry: "{mark} §f{name} §8— §7load time: {time}, errors: {errors}"
  error-count: " §c{count} error(s)"

debug:
  usage: "§eUsage: §f/ksl debug <script>"
  not-found: "§cScript '{script}' was not found."
  title: "§9§lKSL §7— script: §f{script}"
  state-loaded: "§aLoaded"
  state-unloaded: "§cNot loaded"
  state: "§7State: {state} §8| §7load time: {time} §8| §7errors: {errors}"
  resources: "§7Resources: listeners={listeners}, tasks={tasks}, commands={commands}, placeholders={placeholders}, GUI={gui}, entities={entities}"
  yes: "yes"
  no: "no"
  not-measured: "§7KSL-managed callbacks have not been measured yet."
  metrics-title: "§bExecution (total / average / maximum):"
  metric: "  §f{operation} §7— {calls} calls, {failures} errors, {total} ms / {average} ms / {maximum} ms"
  last-failure: "    §cLast failure: {failure}"
  yes: "yes"
  no: "no"

resources:
  empty: "§eNo tracked resources were found."
  title: "§9§lKSL §7— tracked resources: {count}"
  entry: "{color}{script} §8— §7listeners={listeners}, tasks={tasks}, commands={commands}, placeholders={placeholders}, GUI={gui}, entities={entities}"
  leak: "  §cWARNING: an unloaded script still has tracked resources."

deps:
  empty: "§eNo script dependencies were found."
  title: "§9§lKSL §7— script dependency graph (@requires):"
  none: "§7No dependencies declared."
  missing: "  §c→ {dependency} (not found)"

addons:
  empty: "§eNo addons are loaded."
  title: "§9§lKSL §7— loaded addons: {count}"
  dependency: "    §7Depends on: {dependencies}"

services:
  empty: "§eNo KSL services are registered."
  title: "§9§lKSL §7— registered services: {count}"

discord:
  empty: "§eNo Discord channels are configured."
  channels: "§aKSL Discord §7— channels ({count}): §f{channels}"

libraries:
  empty: "§eNo exported libraries are available."
  title: "§9§lKSL §7— exported libraries: {count}"
  owner: "  §f{library} §7— from '{owner}'"

errors:
  unknown-category: "§cUnknown category: {category}. Use one of the letters shown by /ksl error."
  catalog-title: "§aKSL Error Catalog §7— {category} §8({count}, page {page}/{pages})"
  catalog-all: "all categories"
  catalog-next: "§7Details: §f/ksl error <code> §8| §7Next page: §f/ksl errors list {category} {page}"
  summary: "§aKSL Errors §7— total since startup: §f{total} §8| §7catalog entries: §f{count}"
  catalog-command: "§7Catalog: §f/ksl errors list [category] [page]"
  last: "§7Last: §f[{script}] {where} §8({seconds}s ago)"
  code: "§7Code §e{code} §8— §7{title}. Details: §f/ksl error {code}"
  none: "§7No errors have been recorded."

error:
  usage: "§7Usage: §f/ksl error <code> §7(e.g. /ksl error {example})."
  not-found: "§cUnknown KSL error code: {code}."
  title: "§aKSL error §e{code} §8— §f{title} §8({category})"
  hint: "§7What to do: {hint}"

watchdog:
  disabled: "§eKSL Watchdog is disabled."
  active: "§aKSL Watchdog §7— active; no stalls have been recorded since startup."
  stall: "§eKSL Watchdog §7— latest stall: §f{duration} ms"
  dump: "§7Dump: §f{path}"
  guide: "§7Compare SNAPSHOT 1..N; unchanged main-thread frames can reveal where the server is waiting."

validate:
  start: "§7Validating scripts without loading them..."
  ok: "§a§lValidation passed for {count} script(s)."
  failed: "§e{failed} of {total} script(s) have validation problems:"

doctor:
  title: "§9§lKSL §7— system diagnostics:"
  ok: "§a§lAll diagnostic checks passed."
  attention: "§e§l{count} item(s) need attention — see details above."

dbmigrate:
  sqlite: "§eKSL: SQLite is already in use; there is nothing to migrate. Set database.type to mysql or mariadb in config.yml and restart the server."
  read: "§7Reading ksl.db..."
  not-found: "§eKSL: ksl.db was not found in the plugin directory; nothing to migrate."
  found: "§aFound in ksl.db: §fpersist {persist}§a, §ftable {table}§a record(s)."
  copy: "§7They will be copied to {database}. Existing keys will be overwritten; ksl.db will remain unchanged."
  confirm: "§7To start: §f/ksl dbmigrate confirm"
  done: "§a✔ Migration complete: §fpersist {persist}§a and §ftable {table}§a record(s) copied."

sandbox:
  disabled: "§aKSL Sandbox: §edisabled"
  enabled: "§aKSL Sandbox: §fenabled"
  level-strict: "strict: text filter + class deny-list"
  level-text: "text: text filter only"
  level: "§7Level: §f{level}"
  trusted: "§7Trusted scripts: §f{scripts}"
  runtime: "§7Sandbox blocks selected JVM capabilities; it does not isolate scripts from the server JVM."
  description: "§7Sandbox does not remove KSL permissions: Bukkit and the DSL remain available to scripts. See docs/Security-and-Sandbox.md"
  blocklist: "§7Console commands blocked for scripts: §f{commands}"

help:
  unknown: "§cUnknown subcommand '{name}'."
  title: "§9§lKSL §7— commands:"
  reload: "reload all scripts, one script, a folder or only changed scripts (in the background)"
  runtime: "JVM memory, CPU, threads, queues and worker scheduler"
  scripts: "list scripts, load status, load time and errors"
  debug: "execution, errors and resource diagnostics for a script"
  resources: "tracked resources and possible leftovers"
  deps: "@requires dependency graph"
  addons: "loaded addons"
  services: "registered services"
  libraries: "exported libraries"
  discord: "configured Discord channels"
  sandbox: "sandbox status"
  errors: "latest error and the error-code catalog"
  watchdog: "latest server stall and diagnostic dump path"
  error: "look up an error code, for example {code}"
  doctor: "diagnostics (compiler, database, hooks)"
  validate: "validate scripts without loading them"
  dbmigrate: "migrate ksl.db to MySQL/MariaDB"
  language: "show or change the KSL language"

script-command:
  players-only: "§cThis command can only be used by a player."
  no-permission: "§cYou do not have permission to use this command."
  failed: "§cAn error occurred while executing this command. An administrator has been notified in the console."

background:
  error: "§cBackground command failed: {type}: {message}"

lifecycle:
  starting: "§9§l▶ KotlinScriptLoader v{version} starting"
  stopping: "§9§l■ KotlinScriptLoader stopping..."
