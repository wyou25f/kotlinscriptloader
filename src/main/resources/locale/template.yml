# Copy this file to locale/<language>.yml and translate the values.
# Keep every key and {placeholder} unchanged; only translate the text.
command:
  no-permission: "§cYou do not have permission. Required: ksl.admin"

language:
  current: "§aCurrent KSL language: §f{language}"
  available: "§7Available languages: §f{languages}"
  usage: "§7Usage: §f/ksl language <ru|en|custom>"
  changed: "§aKSL language changed to §f{language}§a."
  invalid: "§cLanguage '{language}' is unavailable. Add locale/{language}.yml or choose one of: {available}"

reload:
  busy: "§eA reload is already running. Please wait a moment."
  all:
    start: "§7Validating and reloading all scripts in the background..."
    done: "{color}✔ Reload complete: {loaded} script(s) loaded, {failed} failed."
  changed:
    done: "{color}✔ Changed-script reload: {reloaded} reloaded, {unloaded} unloaded, {unchanged} unchanged, {failed} failed."
  folder:
    start: "§7Reloading scripts in folder '{folder}'..."
    empty: "§eNo scripts were found in folder '{folder}'."
    done: "{color}✔ Folder '{folder}': {loaded} script(s) loaded, {failed} failed."
  script:
    start: "§7Reloading script '{script}'..."
    done: "§a✔ Script '{script}' loaded successfully."
    failed: "§cScript '{script}' could not be loaded. See the console or /ksl errors."

runtime:
  title: "§9§lKSL §7— runtime diagnostics:"
  heap: "§7Heap: §f{used} §7/ §f{max} §8| committed: {committed}"
  nonheap: "§7Non-heap: §f{nonheap} §8| §7CPU: §f{processors} §8| process: §f{process} §8| system: §f{system}"
  threads: "§7JVM threads: §f{threads} §8(daemon: {daemon}) §7| GC: §f{gc} §8({gc-ms} ms)"
  pool: "§bWorker pool §8— §f{workers} thread(s), active={active}, queued={queued}, tracked={tracked}"
  tasks: "§7Completed: §f{completed} §8| §7rejected: §f{rejected}"
  setting: "§7Setting: §f/ksl runtime workers <1-64>"
  heap-note: "§8Heap size is configured by the JVM with -Xms/-Xmx; KSL does not force garbage collection."
  workers:
    usage: "§eUsage: §f/ksl runtime workers <1-64>"
    changed: "§aWorker pool size set to {count} thread(s). Saved to config.yml."

scripts:
  empty: "§eNo scripts were found."
  title: "§9§lKSL §7— loaded scripts: {loaded}/{total}"
  entry: "{mark} §f{name} §8— §7load time: {time}, errors: {errors}"
  error-count: " §c{count} error(s)"

debug:
  usage: "§eUsage: §f/ksl debug <script>"
  not-found: "§cScript '{script}' was not found."
  title: "§9§lKSL §7— script: §f{script}"
  state-loaded: "§aLoaded"
  state-unloaded: "§cNot loaded"
  state: "§7State: {state} §8| §7load time: {time} §8| §7errors: {errors}"
  resources: "§7Resources: listeners={listeners}, tasks={tasks}, commands={commands}, placeholders={placeholders}, GUI={gui}, entities={entities}"
  yes: "yes"
  no: "no"
  not-measured: "§7KSL-managed callbacks have not been measured yet."
  metrics-title: "§bExecution (total / average / maximum):"
  metric: "  §f{operation} §7— {calls} calls, {failures} errors, {total} ms / {average} ms / {maximum} ms"
  last-failure: "    §cLast failure: {failure}"
  yes: "yes"
  no: "no"

resources:
  empty: "§eNo tracked resources were found."
  title: "§9§lKSL §7— tracked resources: {count}"
  entry: "{color}{script} §8— §7listeners={listeners}, tasks={tasks}, commands={commands}, placeholders={placeholders}, GUI={gui}, entities={entities}"
  leak: "  §cWARNING: an unloaded script still has tracked resources."

deps:
  empty: "§eNo script dependencies were found."
  title: "§9§lKSL §7— script dependency graph (@requires):"
  none: "§7No dependencies declared."
  missing: "  §c→ {dependency} (not found)"

addons:
  empty: "§eNo addons are loaded."
  title: "§9§lKSL §7— loaded addons: {count}"
  dependency: "    §7Depends on: {dependencies}"

services:
  empty: "§eNo KSL services are registered."
  title: "§9§lKSL §7— registered services: {count}"

discord:
  empty: "§eNo Discord channels are configured."
  channels: "§aKSL Discord §7— channels ({count}): §f{channels}"

libraries:
  empty: "§eNo exported libraries are available."
  title: "§9§lKSL §7— exported libraries: {count}"
  owner: "  §f{library} §7— from '{owner}'"

errors:
  unknown-category: "§cUnknown category: {category}. Use one of the letters shown by /ksl error."
  catalog-title: "§aKSL Error Catalog §7— {category} §8({count}, page {page}/{pages})"
  catalog-all: "all categories"
  catalog-next: "§7Details: §f/ksl error <code> §8| §7Next page: §f/ksl errors list {category} {page}"
  summary: "§aKSL Errors §7— total since startup: §f{total} §8| §7catalog entries: §f{count}"
  catalog-command: "§7Catalog: §f/ksl errors list [category] [page]"
  last: "§7Last: §f[{script}] {where} §8({seconds}s ago)"
  code: "§7Code §e{code} §8— §7{title}. Details: §f/ksl error {code}"
  none: "§7No errors have been recorded."

error:
  usage: "§7Usage: §f/ksl error <code> §7(e.g. /ksl error {example})."
  not-found: "§cUnknown KSL error code: {code}."
  title: "§aKSL error §e{code} §8— §f{title} §8({category})"
  hint: "§7What to do: {hint}"

error-codes:
  categories:
    a: "Script loading and execution"
    b: "Database and storage"
    c: "Commands and events"
    d: "Effects and particles"
    e: "Mobs and entities"
    f: "GUI menus"
    g: "Integrations, hooks, and Discord"
    h: "Addons and API"
    i: "Configuration and files"
    j: "Scheduler and tasks"
    k: "Placeholders and text"
    l: "System, diagnostics, and plugin shutdown"
  entries:
    '6156a':
      title: "Script compilation failed"
      hint: "Read the diagnostic message below for the line and cause. Validate the script with /ksl validate."
    '2413a':
      title: "Compiler warning"
      hint: "The script loaded, but the compiler found a suspicious construct. Fix it to avoid unexpected behavior."
    '8470a':
      title: "An exception occurred while executing a script"
      hint: "The error occurred in script code. The log identifies the .kts line. Fix the code and run /ksl reload <script>."
    '0248a':
      title: "The script explicitly stopped the current operation with error()"
      hint: "This is a controlled error: the current operation stops, but the script is not unloaded. Read the script's message and fix the reported cause."
    '0878a':
      title: "The script called fatal() and was unloaded"
      hint: "This is an intentional signal: KSL stopped the current script and released resources owned by it. Review the message before reloading."
    '1029a':
      title: "An internal failure occurred during script compilation"
      hint: "This is not an ordinary syntax error. Check Java and the integrity of the KSL JAR, run /ksl doctor, and save the stack trace for a report."
    '1292a':
      title: "The script engine could not execute a compiled script"
      hint: "Review the diagnostic lines below the message. If the script has no obvious issue, check compatibility between Java, the Kotlin scripting engine, and KSL."
    '4726a':
      title: "A forbidden call was detected by Sandbox"
      hint: "The script uses a pattern from the Sandbox deny-list. Remove the call or disable Sandbox in config.yml only if the script is trusted."
    '0983a':
      title: "Script loading took too long"
      hint: "The script's top-level code may perform expensive work (network, disk, or database I/O). Move it to runAsync or an event callback."
    '7040a':
      title: "Script was not found"
      hint: "Check the name: it is relative to scripts/ without .kts, for example economy/shop. Use /ksl reload and Tab completion to inspect IDs."
    '3297a':
      title: "The script path resolves outside scripts/"
      hint: "Use a path inside scripts/ and do not use '..'."
    '9353a':
      title: "@requires points to a missing script"
      hint: "Check the name in // @requires: it must match the script ID (path without .kts)."
    '5610a':
      title: "A cyclic @requires dependency was detected"
      hint: "Scripts depend on each other in a loop. Break the cycle by moving shared code into a third script."
    '1867a':
      title: "Some resources could not be removed while unloading the script"
      hint: "Some script resources (tasks, listeners, commands) may remain. If this repeats, restart the server."
    '7924b':
      title: "The database connection failed"
      hint: "Check database.* in config.yml, that MySQL/MariaDB is running, the database exists, and the user has permissions. See docs/Database-Guide.md."
    '4180b':
      title: "Some records were not saved during shutdown"
      hint: "The database write queue did not drain in time. Do not forcibly kill the server; let it shut down normally."
    '0437b':
      title: "A persist value could not be read"
      hint: "Check the database connection with /ksl doctor. The script will receive its default value."
    '6494b':
      title: "A persist value could not be saved"
      hint: "The value remains in memory only until restart. Check the database connection with /ksl doctor."
    '2750b':
      title: "A table() operation failed"
      hint: "Check the database connection with /ksl doctor. The operation did not complete; other scripts were not affected."
    '8807b':
      title: "The storage does not support this value type"
      hint: "Store only String, Int, Long, Double, Boolean, or null. Serialize lists and objects to strings yourself."
    '5064b':
      title: "A SQL query from a script failed"
      hint: "Check the query text. It should be portable across SQLite and MySQL/MariaDB (avoid PRAGMA and AUTOINCREMENT)."
    '1321b':
      title: "KSL service tables are unavailable"
      hint: "Migrations were not applied. Check whether the database user can CREATE TABLE, then restart the server."
    '7377b':
      title: "A key is longer than 190 characters"
      hint: "MySQL/MariaDB cannot store keys this long. Shorten the key in ksl.db and retry /ksl dbmigrate confirm."
    '3634b':
      title: "increment() failed"
      hint: "The key contains a non-numeric value or the database is unavailable. Check the value and /ksl doctor."
    '9691c':
      title: "Command conflicts with another command"
      hint: "Another plugin or script already owns the name. Rename the command or use the ksl: prefix."
    '5948c':
      title: "An exception occurred in a command handler"
      hint: "The error is in the script command. The player saw a generic message; details are in the console."
    '2204c':
      title: "An exception occurred in Tab completion"
      hint: "The command's tabComplete handler failed. Suggestions were omitted."
    '8261c':
      title: "commandMap is not available for modification"
      hint: "Old commands may remain until the server restarts. This usually indicates an incompatible Paper version."
    '4518c':
      title: "An exception occurred in an event handler"
      hint: "The error occurred in onEvent/on/onJoin or a similar callback. Other plugins processed the event normally."
    '0775c':
      title: "A background /ksl command failed"
      hint: "See the error message. Retry the command; report it if the problem repeats."
    '6831d':
      title: "The particle requires additional data"
      hint: "For DUST, call color(255, 0, 0); for other particles, assign data = ... (BlockData, ItemStack, etc.)."
    '3088d':
      title: "An exception occurred while rendering an effect"
      hint: "The effect was stopped. Check custom{}, stopWhen{}, and onEnd{} in this effect."
    '9145d':
      title: "count is outside the allowed range"
      hint: "count is limited to 0..100 per point to prevent client lag."
    '5401d':
      title: "Unknown effect shape"
      hint: "Check the name in shape(\"...\"); available shapes are listed in the message."
    '1658d':
      title: "Invalid color format"
      hint: "Use color(r, g, b) or a HEX value such as \"#RRGGBB\"."
    '7715e':
      title: "Unknown TYPE in the mob template"
      hint: "Use a name from EntityType, such as ZOMBIE. A ZOMBIE was spawned instead."
    '3972e':
      title: "The entity is not a living mob"
      hint: "spawnCustomEntity creates only LivingEntity types (ZOMBIE, COW, etc.). Items and projectiles cannot be spawned this way."
    '0228e':
      title: "The location has no world"
      hint: "The world may be unloaded or the location was created without a world. Check loc(...) for null."
    '6285e':
      title: "HP is outside the allowed range"
      hint: "HP must be greater than 0 and no more than 1024. The value was ignored."
    '2542e':
      title: "Unknown mob-template key"
      hint: "Allowed keys are listed in the message; custom keys can be added with api.registerEntityAttribute."
    '8599e':
      title: "A mob attribute could not be applied"
      hint: "Check the value and whether this mob supports the attribute (a cow has no attack_damage)."
    '4855e':
      title: "Unknown slot in equip()"
      hint: "Supported slots: HAND, OFFHAND, HELMET, CHESTPLATE, LEGGINGS, BOOTS."
    '1112e':
      title: "equip() contains a value that is not an item"
      hint: "Check the material name, for example DIAMOND_SWORD."
    '7169e':
      title: "The mob's onTick handler was disabled after errors"
      hint: "The handler failed five times consecutively and was stopped. Fix the code and recreate the mob."
    '3426e':
      title: "An exception occurred in a mob handler"
      hint: "The error occurred in onTick/onDeath/onDamaged/onAttack. The mob's other behavior continues."
    '9482e':
      title: "A mob could not be removed during unload"
      hint: "The mob may remain in the world and will be removed when the chunk is loaded again."
    '5739f':
      title: "rows is outside 1..6"
      hint: "An inventory must have 1..6 rows. The nearest valid value was used."
    '1996f':
      title: "Slot is outside the inventory"
      hint: "Slots are numbered from 0 to rows*9-1. The item was not added."
    '8052f':
      title: "MiniMessage could not parse the GUI title"
      hint: "Check title tags. The title was displayed as plain text."
    '4309f':
      title: "paginate() was called without slots"
      hint: "Pass a non-empty list of page slots."
    '0566f':
      title: "An exception occurred in a GUI handler"
      hint: "An error occurred while clicking, closing, or rendering a GUI page. The menu remains open."
    '6623f':
      title: "gui() was called outside the main thread"
      hint: "Wrap menu creation in sync { } or call it from an event."
    '2879g':
      title: "Could not initialize a hook"
      hint: "The plugin is installed, but its API is unavailable or incompatible. Check the plugin version."
    '8936g':
      title: "Discord channel is not configured"
      hint: "Add a webhook to config.yml: discord.webhooks.<channel>."
    '5193g':
      title: "Could not send a Discord message"
      hint: "Network error. Check whether the server can reach discord.com."
    '1450g':
      title: "Discord returned an error"
      hint: "The response code is in the message: 401/404 usually means an invalid webhook; 400 means invalid content."
    '7506g':
      title: "Could not register PlaceholderAPI expansion"
      hint: "Check the PlaceholderAPI version. %ksl_*% placeholders will not work."
    '3763g':
      title: "PlaceholderAPI is not installed"
      hint: "The placeholder was skipped. Install PlaceholderAPI to use %ksl_*%."
    '9820h':
      title: "Addon failed to load"
      hint: "onLoad threw an exception; the addon's registrations were rolled back. See the error message for details."
    '6077h':
      title: "KSL API version is too old for the addon"
      hint: "Update KotlinScriptLoader or use an earlier addon version."
    '2333h':
      title: "An addon with this ID is already loaded"
      hint: "The old instance was unloaded before replacement. Check for duplicate addon JARs."
    '8390h':
      title: "Error while unloading an addon"
      hint: "onUnload threw an exception. The addon's registrations were still removed."
    '4647h':
      title: "Addon dependency is not loaded"
      hint: "Add depend to the addon's plugin.yml or use api.whenReady(id) { } inside onLoad."
    '0903h':
      title: "An addon is being unloaded while other addons depend on it"
      hint: "Unload dependent addons first or restart the server."
    '6960h':
      title: "Registration replaced a resource owned by another addon"
      hint: "A service, hook, shape, attribute, or placeholder with this name already exists. Use a unique key prefixed with your addon ID."
    '3217h':
      title: "Service or hook type did not match"
      hint: "The class was loaded by different classloaders. Do not bundle the provider API in your JAR; use compileOnly."
    '9274h':
      title: "Exception in an addon callback"
      hint: "An error occurred in onAddonReady, a context extension, or an event-bus subscriber. Other callbacks still ran."
    '5530h':
      title: "Exception in api.listen"
      hint: "An error occurred in a Bukkit event handler registered by the addon."
    '1787h':
      title: "A library export was overwritten"
      hint: "Two scripts export the same key. Use unique keys in export()."
    '7844i':
      title: "YAML file is corrupted"
      hint: "A *.broken-<time> copy was created and an empty config is being used. Fix indentation and quotes, then reload the script."
    '4101i':
      title: "Could not read YAML"
      hint: "Check file permissions and whether another program has locked the file."
    '0357i':
      title: "Could not save YAML"
      hint: "Check write permissions and available disk space."
    '6414i':
      title: "YAML path escapes the scripts/ directory"
      hint: "loadYaml accepts only paths inside scripts/."
    '2671i':
      title: "Invalid database setting in config.yml"
      hint: "Correct the value according to the error message. See docs/Database-Guide.md for an example."
    '8728j':
      title: "Exception in a scheduled task"
      hint: "An error occurred in delay/every/sync/async or a similar callback. A repeating task will continue."
    '4984j':
      title: "Task period is less than one tick"
      hint: "The period must be at least one tick. A value of 1 was used."
    '1241k':
      title: "An @placeholder@ token was not replaced in text"
      hint: "Check the key name in message()/richMessage(), or register it with textPlaceholder."
    '7298k':
      title: "Exception in a %ksl_...% resolver"
      hint: "An error occurred in placeholder { }. Players received an empty string."
    '3554k':
      title: "Placeholder key is already in use"
      hint: "Another script or addon registered the same key. The new resolver replaced the old one."
    '9611k':
      title: "Text placeholder name is reserved"
      hint: "player, world, online, maxplayers, health, and ping are built in. Choose another key."
    '5868k':
      title: "Exception in a text placeholder"
      hint: "An error occurred in textPlaceholder { }. An empty string was substituted."
    '2125l':
      title: "Error while stopping the plugin"
      hint: "Some resources were not released normally. If this happens on every shutdown, report the issue."
    '8181l':
      title: "Could not create .autocomplete.kts"
      hint: "Check write permissions for scripts/. Script execution is not affected."
    '4438a':
      title: "Script auto-reload did not start"
      hint: "Check permissions for scripts/ and the operating-system file watcher limit. Scripts can still be reloaded with /ksl reload."
    '0695a':
      title: "The script tried to access a forbidden class"
      hint: "Sandbox denied a class from its deny-list (Runtime, ProcessBuilder, reflection, ClassLoader, etc.). Remove the call or add the script to security.sandbox-trusted if it is trusted."
    '6752a':
      title: "The script exceeded its event-handler limit"
      hint: "The script registers onEvent in a loop or from another event. Register each handler once at top level. Limit: security.limits.max-listeners-per-script."
    '3008a':
      title: "The script exceeded its task limit"
      hint: "The script creates too many delay/every/sync tasks. Do not create tasks in an unbounded loop. Limit: security.limits.max-tasks-per-script."
    '9065a':
      title: "The new version did not compile; the previous version remains active"
      hint: "The old script version is still running. Fix the errors above and run /ksl reload <script> again."
    '5322c':
      title: "A console command was blocked"
      hint: "The command is listed in security.console-command-blocklist. Remove it only if the script is trusted."
    '1579b':
      title: "The database write queue is growing"
      hint: "The database writes more slowly than scripts submit writes. Check database performance and set()/persist frequency; see /ksl doctor."
    '4958a':
      title: "A script import could not be resolved"
      hint: "Check the file name and import path; the file must be inside the permitted scripts/ directory."
    '8623a':
      title: "Cyclic import"
      hint: "Remove the mutual import and move shared declarations into a separate script."
    '7342a':
      title: "Invalid import syntax"
      hint: "Compare the import format with KSL documentation and check the name's capitalization."
    '5689a':
      title: "Script compilation timed out"
      hint: "Check expensive constructs and the number of imports; try validating one script separately."
    '4902a':
      title: "The compiler ran out of memory"
      hint: "Check available JVM memory and the size of the script being compiled."
    '4039a':
      title: "The compiler is unavailable"
      hint: "Check the KSL JAR and Java version; restart the server after updating."
    '6132a':
      title: "Script classes conflict"
      hint: "Rename conflicting declarations or move the shared type into an addon API."
    '4010a':
      title: "A script ID is duplicated"
      hint: "Keep only one file with that relative path under scripts/."
    '3519a':
      title: "Dependency order is invalid"
      hint: "Declare required scripts with // @requires and check for dependency cycles."
    '9317a':
      title: "A dependency could not be loaded"
      hint: "Fix the dependent script first, then reload the current script."
    '5242a':
      title: "A reload is already running"
      hint: "Wait for the current operation to finish, then retry."
    '7995a':
      title: "Reload was cancelled"
      hint: "Check whether the plugin is shutting down or an administrator cancelled the task."
    '4409a':
      title: "The script is busy and could not be unloaded"
      hint: "Check long-running callbacks and active tasks; retry unloading after they finish."
    '0858a':
      title: "Script source is unavailable"
      hint: "Check file read permissions and encoding; use UTF-8."
    '7529a':
      title: "Invalid source encoding"
      hint: "Save the .kts file as UTF-8 and check for corrupted characters."
    '9652b':
      title: "The connection pool is exhausted"
      hint: "Check long transactions and unclosed resources. Increase pool-size only after measuring the load."
    '4479b':
      title: "Connection acquisition timed out"
      hint: "Check database availability, network connectivity, and pool size."
    '8877b':
      title: "The database connection was lost"
      hint: "Check the MySQL/MariaDB or SQLite log and network interruptions."
    '3713b':
      title: "The database rejected authentication"
      hint: "Check the username, password, and permissions for the selected database."
    '1376b':
      title: "The database schema is newer than this KSL version"
      hint: "Update KSL to a version that supports the schema. Do not edit the version manually to downgrade it."
    '8532b':
      title: "The database migration did not complete"
      hint: "Save a backup and inspect the original SQL error before retrying."
    '5999b':
      title: "A migration is already running"
      hint: "Make sure another KSL instance is not changing the same database."
    '9244b':
      title: "A transaction could not be started"
      hint: "Check the connection and transaction support of the selected database engine."
    '9201b':
      title: "A transaction could not be committed"
      hint: "Check database state. The operation result may be unknown; verify the stored data."
    '8667b':
      title: "A transaction could not be rolled back"
      hint: "Save the original error and check the connection. Restore from backup if necessary."
    '8127b':
      title: "A SQL query took too long"
      hint: "Check the query plan, indexes, and locks. Do not run a heavy query on the main thread."
    '4792b':
      title: "SQL syntax error"
      hint: "Check the SQL and compatibility with the SQLite/MySQL/MariaDB dialect."
    '8205b':
      title: "A table constraint was violated"
      hint: "Check uniqueness, NOT NULL constraints, and foreign keys for the supplied data."
    '1139b':
      title: "The database detected a deadlock"
      hint: "Retry a safe operation and check row-update order across concurrent transactions."
    '1272b':
      title: "The write queue rejected an operation"
      hint: "Check the queue size and database speed. Handle the rejection; do not assume the value was saved."
    '6515c':
      title: "Invalid command name"
      hint: "Use Latin letters, numbers, and hyphens; check Bukkit naming restrictions."
    '3602c':
      title: "The sender does not have permission to run the command"
      hint: "Check the permission node and the permissions assigned to the player."
    '5377c':
      title: "A required command argument is missing"
      hint: "Add the required argument or display the usage message."
    '1350c':
      title: "A command argument has an invalid format"
      hint: "Check the type, allowed range, and usage message."
    '0499c':
      title: "A command alias is already in use"
      hint: "Choose a unique alias or remove the conflicting registration."
    '0462c':
      title: "Command registration failed"
      hint: "Check commandMap, the command name, and conflicts with other plugins."
    '3845c':
      title: "Command unregistration failed"
      hint: "Check commandMap state. A server restart may be required to clear it."
    '6341c':
      title: "The command called Bukkit API from an async thread"
      hint: "Move the Bukkit call into sync { } or the main thread."
    '9751c':
      title: "This command sender type is not supported"
      hint: "Check whether the command permits the console, players, or command blocks."
    '3682c':
      title: "The command is still on cooldown"
      hint: "Wait for the cooldown or check its configuration."
    '4929d':
      title: "Unknown particle type"
      hint: "Use a Particle value that exists in your Paper version."
    '1494d':
      title: "Particle data is incompatible with the particle type"
      hint: "Pass data of the type expected by the selected particle."
    '7459d':
