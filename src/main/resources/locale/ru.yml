# Встроенная русская локализация KotlinScriptLoader.
# При создании своего языка сохраняй ключи и все {плейсхолдеры}.
command:
  no-permission: "§cНет прав. Требуется: ksl.admin"

language:
  current: "§aТекущий язык KSL: §f{language}"
  available: "§7Доступные языки: §f{languages}"
  usage: "§7Использование: §f/ksl language <ru|en|custom>"
  changed: "§aЯзык KSL изменён на §f{language}§a."
  invalid: "§cЯзык '{language}' недоступен. Добавь locale/{language}.yml или выбери один из: {available}"

reload:
  busy: "§eПерезагрузка уже выполняется. Подожди немного."
  all:
    start: "§7Проверяю и перезагружаю все скрипты в фоновом режиме..."
    done: "{color}✔ Перезагрузка завершена: загружено скриптов — {loaded}, ошибок — {failed}."
  changed:
    done: "{color}✔ Перезагрузка изменённых скриптов: перезагружено — {reloaded}, выгружено — {unloaded}, без изменений — {unchanged}, ошибок — {failed}."
  folder:
    start: "§7Перезагружаю скрипты в папке '{folder}'..."
    empty: "§eВ папке '{folder}' не найдено скриптов."
    done: "{color}✔ Папка '{folder}': загружено скриптов — {loaded}, ошибок — {failed}."
  script:
    start: "§7Перезагружаю скрипт '{script}'..."
    done: "§a✔ Скрипт '{script}' успешно загружен."
    failed: "§cНе удалось загрузить скрипт '{script}'. Подробности смотри в консоли или через /ksl errors."

runtime:
  title: "§9§lKSL §7— диагностика runtime:"
  heap: "§7Heap: §f{used} §7/ §f{max} §8| committed: {committed}"
  nonheap: "§7Non-heap: §f{nonheap} §8| §7CPU: §f{processors} §8| процесс: §f{process} §8| система: §f{system}"
  threads: "§7Потоки JVM: §f{threads} §8(daemon: {daemon}) §7| GC: §f{gc} §8({gc-ms}мс)"
  pool: "§bWorker pool §8— §f{workers} поток(ов), active={active}, queued={queued}, tracked={tracked}"
  tasks: "§7Завершено: §f{completed} §8| §7отклонено: §f{rejected}"
  setting: "§7Настройка: §f/ksl runtime workers <1-64>"
  heap-note: "§8Размер heap задаётся JVM через -Xms/-Xmx; KSL не вызывает принудительную сборку мусора."
  workers:
    usage: "§eИспользование: §f/ksl runtime workers <1-64>"
    changed: "§aРазмер worker pool изменён: {count} поток(ов). Сохранено в config.yml."

scripts:
  empty: "§eСкрипты не найдены."
  title: "§9§lKSL §7— загруженные скрипты: {loaded}/{total}"
  entry: "{mark} §f{name} §8— §7загрузка: {time}, ошибки: {errors}"
  error-count: " §c{count} ошибок"

debug:
  usage: "§eИспользование: §f/ksl debug <script>"
  not-found: "§cСкрипт '{script}' не найден."
  title: "§9§lKSL §7— скрипт: §f{script}"
  state-loaded: "§aзагружен"
  state-unloaded: "§cне загружен"
  state: "§7Состояние: {state} §8| §7загрузка: {time} §8| §7ошибки: {errors}"
  resources: "§7Ресурсы: listeners={listeners}, tasks={tasks}, commands={commands}, placeholders={placeholders}, GUI={gui}, entities={entities}"
  not-measured: "§7Вызовы KSL-managed callbacks ещё не измерялись."
  metrics-title: "§bВыполнение (суммарное / среднее / максимум):"
  metric: "  §f{operation} §7— вызовов: {calls}, ошибок: {failures}, {total}мс / {average}мс / {maximum}мс"
  last-failure: "    §cПоследняя ошибка: {failure}"
  'yes': "да"
  'no': "нет"

resources:
  empty: "§eОтслеживаемые ресурсы не найдены."
  title: "§9§lKSL §7— отслеживаемые ресурсы: {count}"
  entry: "{color}{script} §8— §7listeners={listeners}, tasks={tasks}, commands={commands}, placeholders={placeholders}, GUI={gui}, entities={entities}"
  leak: "  §cВНИМАНИЕ: у выгруженного скрипта остались отслеживаемые ресурсы."

deps:
  empty: "§eЗависимости скриптов не найдены."
  title: "§9§lKSL §7— граф зависимостей скриптов (@requires):"
  none: "§7Зависимости не объявлены."
  missing: "  §c→ {dependency} (не найдено)"

addons:
  empty: "§eЗагруженных аддонов нет."
  title: "§9§lKSL §7— загруженные аддоны: {count}"
  dependency: "    §7Зависит от: {dependencies}"

services:
  empty: "§eСервисы KSL не зарегистрированы."
  title: "§9§lKSL §7— зарегистрированные сервисы: {count}"

discord:
  empty: "§eКаналы Discord не настроены."
  channels: "§aKSL Discord §7— каналы ({count}): §f{channels}"

libraries:
  empty: "§eЭкспортированных библиотек нет."
  title: "§9§lKSL §7— экспортированные библиотеки: {count}"
  owner: "  §f{library} §7— владелец: '{owner}'"

errors:
  unknown-category: "§cНеизвестная категория: {category}. Используй одну из букв, показанных командой /ksl error."
  catalog-title: "§aKSL Каталог ошибок §7— {category} §8({count}, стр. {page}/{pages})"
  catalog-all: "все категории"
  catalog-next: "§7Подробности: §f/ksl error <код> §8| §7Следующая страница: §f/ksl errors list {category} {page}"
  summary: "§aKSL Ошибки §7— всего с запуска: §f{total} §8| §7причин в каталоге: §f{count}"
  catalog-command: "§7Каталог: §f/ksl errors list [категория] [страница]"
  last: "§7Последняя: §f[{script}] {where} §8({seconds}с назад)"
  code: "§7Код §e{code} §8— §7{title}. Подробнее: §f/ksl error {code}"
  none: "§7Ошибок не зафиксировано."

error:
  usage: "§7Использование: §f/ksl error <код> §7(например /ksl error {example})."
  not-found: "§cНеизвестный код ошибки KSL: {code}."
  title: "§aОшибка KSL §e{code} §8— §f{title} §8({category})"
  hint: "§7Что делать: {hint}"

error-codes:
  categories:
    a: "Загрузка и выполнение скриптов"
    b: "База данных и хранилище"
    c: "Команды и события"
    d: "Эффекты и частицы"
    e: "Мобы и сущности"
    f: "GUI-меню"
    g: "Интеграции, хуки и Discord"
    h: "Аддоны и API"
    i: "Конфигурация и файлы"
    j: "Планировщик и задачи"
    k: "Плейсхолдеры и тексты"
    l: "Система, диагностика и остановка плагина"
  entries:
    '6156a':
      title: "Ошибка компиляции скрипта"
      hint: "Открой сообщение ниже: там строка и причина. Проверь скрипт командой /ksl validate."
    '2413a':
      title: "Предупреждение компилятора"
      hint: "Скрипт загружен, но компилятор нашёл подозрительное место. Исправь, чтобы не было неожиданностей."
    '8470a':
      title: "Исключение при выполнении скрипта"
      hint: "Ошибка случилась в коде скрипта. В логе указана строка .kts. Исправь код и сделай /ksl reload <скрипт>."
    '0248a':
      title: "Скрипт явно остановил текущую операцию через error()"
      hint: "error() — управляемая ошибка: текущая операция остановлена, сам скрипт не выгружается. Прочитай сообщение скрипта и исправь указанную причину."
    '0878a':
      title: "Скрипт вызвал fatal() и был выгружен"
      hint: "Это намеренный сигнал: KSL остановил текущий скрипт и освободил принадлежащие ему ресурсы. Проверь сообщение перед перезагрузкой."
    '1029a':
      title: "Внутренний сбой при компиляции скрипта"
      hint: "Это не обычная ошибка синтаксиса. Проверь Java и целостность JAR KSL, запусти /ksl doctor; сохрани stack trace для отчёта."
    '1292a':
      title: "Скриптовый движок не смог выполнить скомпилированный скрипт"
      hint: "Посмотри строки диагностики ниже. Если скрипт не содержит очевидной ошибки, проверь совместимость Java, Kotlin scripting engine и KSL."
    '4726a':
      title: "Запрещённый вызов (sandbox)"
      hint: "Скрипт использует паттерн из списка sandbox. Убери вызов или выключи sandbox в config.yml, если скрипту можно доверять."
    '0983a':
      title: "Скрипт загружается слишком долго"
      hint: "В top-level коде есть тяжёлые операции (сеть, диск, БД). Вынеси их в runAsync или onEvent."
    '7040a':
      title: "Скрипт не найден"
      hint: "Проверь имя: оно считается от папки scripts/ без .kts, например economy/shop. Список: /ksl reload и Tab."
    '3297a':
      title: "Имя скрипта выходит за пределы scripts/"
      hint: "Используй только путь внутри папки scripts/, без '..'."
    '9353a':
      title: "@requires указывает на несуществующий скрипт"
      hint: "Проверь имя в строке // @requires: оно должно совпадать с идентификатором скрипта (путь без .kts)."
    '5610a':
      title: "Циклическая зависимость @requires"
      hint: "Скрипты ссылаются друг на друга по кругу. Разорви цикл: вынеси общий код в третий скрипт."
    '1867a':
      title: "Не всё удалось убрать при выгрузке скрипта"
      hint: "Часть ресурсов скрипта (задачи, слушатели, команды) могла остаться. Если повторяется, перезапусти сервер."
    '7924b':
      title: "Не удалось подключиться к базе данных"
      hint: "Проверь database.* в config.yml, доступность выбранного backend-а (MySQL, MariaDB или PostgreSQL), наличие базы и права пользователя."
    '4180b':
      title: "Часть записей не сохранилась при остановке"
      hint: "Очередь записи в БД не успела опустеть. Не убивай сервер принудительно, дай ему остановиться штатно."
    '0437b':
      title: "Не удалось прочитать persist-значение"
      hint: "Проверь соединение с БД (/ksl doctor). Скрипт получит значение по умолчанию."
    '6494b':
      title: "Не удалось сохранить persist-значение"
      hint: "Значение осталось только в памяти до рестарта. Проверь соединение с БД (/ksl doctor)."
    '2750b':
      title: "Операция с table() не удалась"
      hint: "Проверь соединение с БД (/ksl doctor). Операция не выполнена, остальные скрипты не затронуты."
    '8807b':
      title: "Тип значения не поддерживается хранилищем"
      hint: "Сохраняй только String, Int, Long, Double, Boolean или null. Списки и объекты сериализуй в строку сам."
    '5064b':
      title: "SQL-запрос из скрипта не удался"
      hint: "Для переносимости между SQLite, MySQL, MariaDB и PostgreSQL избегай PRAGMA, AUTOINCREMENT и других dialect-specific конструкций."
    '1321b':
      title: "Служебные таблицы KSL недоступны"
      hint: "Миграции не применились. Проверь права пользователя БД на CREATE TABLE и перезапусти сервер."
    '7377b':
      title: "Ключ длиннее 190 символов"
      hint: "Удалённые SQL-backend-ы KSL ограничивают ключевые колонки 190 символами. Сократи ключ в ksl.db и повтори /ksl dbmigrate confirm."
    '3634b':
      title: "increment() не удался"
      hint: "По указанному ключу лежит не число или БД недоступна. Проверь значение и /ksl doctor."
    '9691c':
      title: "Команда конфликтует с другой"
      hint: "Имя команды занято другим плагином или скриптом. Переименуй команду или используй префикс ksl:имя."
    '5948c':
      title: "Исключение в обработчике команды"
      hint: "Ошибка в коде команды скрипта. Игрок увидел общее сообщение, детали в консоли."
    '2204c':
      title: "Исключение в подсказках Tab"
      hint: "Ошибка в tabComplete команды. Подсказки для неё не показаны."
    '8261c':
      title: "commandMap недоступен для изменения"
      hint: "Старые команды останутся до перезапуска сервера. Обычно это признак несовместимой версии Paper."
    '4518c':
      title: "Исключение в обработчике события"
      hint: "Ошибка в onEvent/on/onJoin и подобных. Событие обработано остальными плагинами как обычно."
    '0775c':
      title: "Фоновая команда /ksl не выполнилась"
      hint: "Подробности в тексте ошибки. Повтори команду, при повторе сообщи об ошибке."
    '6831d':
      title: "Частице нужны дополнительные данные"
      hint: "Для DUST вызови color(255, 0, 0), для остальных присвой data = ... (BlockData, ItemStack и т.п.)."
    '3088d':
      title: "Исключение при отрисовке эффекта"
      hint: "Эффект остановлен. Проверь custom{}, stopWhen{} и onEnd{} в этом эффекте."
    '9145d':
      title: "count вне допустимого диапазона"
      hint: "count ограничен значениями 0..100 на точку, иначе клиенты лагают."
    '5401d':
      title: "Неизвестная форма эффекта"
      hint: "Проверь имя в shape(\\\"...\\\"): доступные формы перечислены в сообщении."
    '1658d':
      title: "Неверный формат цвета"
      hint: "Используй color(r, g, b) или HEX вида \\\"#RRGGBB\\\"."
    '7715e':
      title: "Неизвестный TYPE в шаблоне моба"
      hint: "Используй имя из EntityType, например ZOMBIE. Вместо него заспавнен ZOMBIE."
    '3972e':
      title: "Сущность не является живым мобом"
      hint: "spawnCustomEntity создаёт только LivingEntity (ZOMBIE, COW...). Предметы и снаряды так не спавнятся."
    '0228e':
      title: "У локации нет мира"
      hint: "Мир не загружен или локация создана без мира. Проверь loc(...) на null."
    '6285e':
      title: "HP вне допустимого диапазона"
      hint: "HP должен быть больше 0 и не больше 1024. Значение проигнорировано."
    '2542e':
      title: "Неизвестный ключ шаблона моба"
      hint: "Допустимые ключи перечислены в сообщении; свои можно добавить через api.registerEntityAttribute."
    '8599e':
      title: "Не удалось применить атрибут моба"
      hint: "Проверь значение и что у этого моба есть такой атрибут (у коровы нет attack_damage)."
    '4855e':
      title: "Неизвестный слот в equip()"
      hint: "Доступны HAND, OFFHAND, HELMET, CHESTPLATE, LEGGINGS, BOOTS."
    '1112e':
      title: "В equip() указан не предмет"
      hint: "Проверь название материала, например DIAMOND_SWORD."
    '7169e':
      title: "onTick моба отключён после ошибок"
      hint: "Обработчик onTick упал 5 раз подряд и остановлен. Исправь код и пересоздай моба."
    '3426e':
      title: "Исключение в обработчике моба"
      hint: "Ошибка в onTick/onDeath/onDamaged/onAttack. Остальное поведение моба продолжает работать."
    '9482e':
      title: "Не удалось убрать моба при выгрузке"
      hint: "Моб мог остаться в мире, он будет удалён при следующей загрузке чанка."
    '5739f':
      title: "rows вне диапазона 1..6"
      hint: "Размер инвентаря 1..6 рядов. Использовано ближайшее допустимое значение."
    '1996f':
      title: "Слот вне инвентаря"
      hint: "Слоты нумеруются от 0 до rows*9-1. Предмет не добавлен."
    '8052f':
      title: "Не разобрался MiniMessage в заголовке GUI"
      hint: "Проверь теги в заголовке. Он показан как обычный текст."
    '4309f':
      title: "paginate() без слотов"
      hint: "Передай непустой список слотов для страницы."
    '0566f':
      title: "Исключение в обработчике GUI"
      hint: "Ошибка в клике, закрытии или отрисовке страницы GUI. Меню остаётся открытым."
    '6623f':
      title: "gui() вызван не из главного потока"
      hint: "Оберни создание меню в sync { } или вызывай из события."
    '2879g':
      title: "Не удалось инициализировать хук"
      hint: "Плагин установлен, но его API недоступно или другой версии. Проверь версию плагина."
    '8936g':
      title: "Discord-канал не настроен"
      hint: "Добавь вебхук в config.yml: discord.webhooks.<канал>."
    '5193g':
      title: "Не удалось отправить в Discord"
      hint: "Сетевая ошибка. Проверь доступ сервера к discord.com."
    '1450g':
      title: "Discord вернул ошибку"
      hint: "Код ответа указан в сообщении: 401/404 значит неверный вебхук, 400 значит неверное содержимое."
    '7506g':
      title: "Не удалось зарегистрировать PlaceholderAPI expansion"
      hint: "Проверь версию PlaceholderAPI. Плейсхолдеры %ksl_*% работать не будут."
    '3763g':
      title: "PlaceholderAPI не установлен"
      hint: "Плейсхолдер пропущен. Установи PlaceholderAPI, чтобы использовать %ksl_*%."
    '9820h':
      title: "Аддон не загрузился"
      hint: "onLoad бросил исключение, регистрации аддона откатаны. Подробности в тексте ошибки."
    '6077h':
      title: "Версия API KSL слишком старая для аддона"
      hint: "Обнови KotlinScriptLoader или используй более раннюю версию аддона."
    '2333h':
      title: "Аддон с таким id уже загружен"
      hint: "Старый экземпляр выгружен перед заменой. Проверь, нет ли двух копий аддона."
    '8390h':
      title: "Ошибка при выгрузке аддона"
      hint: "onUnload бросил исключение. Ресурсы аддона всё равно сняты."
    '4647h':
      title: "Зависимость аддона не загружена"
      hint: "Добавь depend в plugin.yml аддона или используй api.whenReady(id) { } внутри onLoad."
    '0903h':
      title: "Аддон выгружается, хотя от него зависят"
      hint: "Выгрузи зависимые аддоны первыми или перезапусти сервер."
    '6960h':
      title: "Регистрация перезаписала чужую"
      hint: "Сервис, хук, форма, атрибут или плейсхолдер с таким именем уже был. Используй уникальный ключ с префиксом аддона."
    '3217h':
      title: "Тип сервиса или хука не совпал"
      hint: "Класс загружен разными classloader'ами: не упаковывай API провайдера в свой jar, используй compileOnly."
    '9274h':
      title: "Исключение в колбэке аддона"
      hint: "Ошибка в onAddonReady, расширении контекста или подписчике шины событий. Остальные колбэки выполнены."
    '5530h':
      title: "Исключение в api.listen"
      hint: "Ошибка в обработчике Bukkit-события, зарегистрированном аддоном."
    '1787h':
      title: "Экспорт библиотеки перезаписан"
      hint: "Два скрипта экспортируют один ключ. Используй уникальные ключи в export()."
    '7844i':
      title: "Файл YAML повреждён"
