
name: Bug Report
description: Report a bug or unexpected behavior in KSL.
title: "[Bug]: "
labels:
  - bug
  - status: needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please provide as much information as possible.

  - type: input
    id: version
    attributes:
      label: KSL Version
      description: Which version of KotlinScriptLoader are you using?
      placeholder: "e.g. 2.0.0"
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Server Software
      placeholder: "e.g. Paper 1.21.4"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the issue.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start the server
        2. Execute a script
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Errors
      description: Paste relevant logs or stack traces.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have checked for existing issues.
          required: true
        - label: I am using the latest available KSL version.
          required: false
