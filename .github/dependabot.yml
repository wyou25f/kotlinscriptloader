version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
      runtime-dependencies:
        patterns:
          - "com.zaxxer:*"
          - "org.xerial:*"
          - "org.mariadb.jdbc:*"
          - "org.postgresql:*"
          - "org.tomlj:*"
          - "de.tr7zw:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
