name: KSL Compatibility Build · Minecraft 1.18+
run-name: "KSL Compatibility Build · Minecraft 1.18+ · ${{ github.sha }}"

on:
  push:
    branches: ['compat/mc-1.18-plus']
  pull_request:
    branches: ['compat/mc-1.18-plus']
  workflow_dispatch:

concurrency:
  group: ksl-KSL-compat-1.18-plus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compatibility branch
        uses: actions/checkout@v4

      - name: Set up build JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up PowerShell
        shell: bash
        run: command -v pwsh >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnose compatibility build environment
        shell: pwsh
        run: ./build.ps1 -Task Diagnose

      - name: Run branch-specific quality gate
        shell: pwsh
        run: ./build.ps1 -Task Quality -NoDaemon -Detailed

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KSL-compat-1.18-plus-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: |
            build-reports/
            build/reports/tests/test/
            build/test-results/test/
            build/reports/kover/
            build/reports/quality/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble and verify compatibility JAR
        shell: pwsh
        run: ./build.ps1 -Task Package -NoDaemon

      - name: Inspect plugin JAR
        shell: pwsh
        run: ./scripts/Inspect-Jar.ps1

      - name: Upload compatibility JAR and checksum
        uses: actions/upload-artifact@v4
        with:
          name: KSL-compat-1.18-plus-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            build-reports/jar-inspection.json
          if-no-files-found: error
          retention-days: 30
