name: Build
run-name: "KSL build #${{ github.run_number }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Clean and run unit tests
        run: bash ./gradlew --no-daemon clean test --stacktrace
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KSL-test-reports-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble and verify plugin JAR
        run: bash ./gradlew --no-daemon build -x test --stacktrace
      - name: Verify IntelliJ IDEA companion setup
        run: bash ./gradlew --no-daemon -p ide -PkslJar=../build/libs/KotlinScriptLoader-1.2.0.jar verifyKslIdeSetup
      - name: Generate JAR checksum
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)
          test -n "$JAR"
          sha256sum "$JAR" | tee build/libs/SHA256SUMS
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KSL-build-${{ github.run_number }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
