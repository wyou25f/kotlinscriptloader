name: Build
run-name: "KSL build #${{ github.run_number }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ksl-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate native Bash tools
        shell: bash
        run: |
          bash -n build.sh scripts/*.sh
          ./build.sh --help
          ./scripts/diagnose-environment.sh --help
          ./scripts/inspect-jar.sh --help

      - name: Validate documentation and website assets
        shell: bash
        run: |
          set -euo pipefail
          node --check website/assets/app.js
          node --check docs/site/app.js
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          prefix = "window.KSL_BOOKS = "
          source = Path("docs/site/books-data.js").read_text(encoding="utf-8")
          assert source.startswith(prefix) and source.rstrip().endswith(";"), "Invalid offline book data wrapper"
          books = json.loads(source[len(prefix):].strip()[:-1])
          expected = [
              ("scripts", "docs/01-scripts.md"),
              ("addons", "docs/02-addons.md"),
              ("data", "docs/03-data-and-databases.md"),
              ("cookbook", "docs/04-cookbook.md"),
          ]
          assert [(book["id"], book["file"]) for book in books] == expected, "Offline reader must contain exactly the four canonical books"
          for book in books:
              markdown = Path(book["file"]).read_text(encoding="utf-8")
              assert book["content"] == markdown, f"Offline reader is stale for {book['file']}"
              assert len(markdown) > 15000, f"Book unexpectedly short: {book['file']}"
          svgs = list(Path("website/assets").glob("*.svg")) + list(Path("docs/site/assets").glob("*.svg"))
          assert svgs, "No SVG assets found"
          for svg in svgs:
              ET.parse(svg)
          print(f"Validated {len(books)} books and {len(svgs)} SVG assets.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnose build environment
        shell: bash
        run: ./build.sh -Task Diagnose

      - name: Run strict quality gate
        shell: bash
        run: ./build.sh -Task Quality -NoDaemon -Detailed

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KSL-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: |
            build-reports/
            build/reports/tests/test/
            build/test-results/test/
            build/reports/kover/
            build/reports/quality/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Build self-contained JAR for live Paper integration
        run: bash ./gradlew --no-daemon -PfatJar=true shadowJar verifyShadowJar

      - name: Build real-Paper NBT integration test plugin
        run: bash ./gradlew --no-daemon paperIntegrationPluginJar

      - name: Run binary NBT integration tests on Paper 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_DIR="$GITHUB_WORKSPACE/build/paper-integration/plugins"
          RESULT_FILE="$PLUGIN_DIR/KSLNBTIntegration/result.txt"
          mkdir -p "$PLUGIN_DIR"
          FAT_JAR="$(find build/libs -maxdepth 1 -type f -name '*-fat.jar' -print -quit)"
          test -n "$FAT_JAR"
          cp "$FAT_JAR" "$PLUGIN_DIR/KotlinScriptLoader.jar"
          cp build/paper-integration/artifacts/KSLNBTIntegration.jar "$PLUGIN_DIR/KSLNBTIntegration.jar"
          chmod 0777 "$PLUGIN_DIR"

          docker run -d --name ksl-paper-nbt-integration \
            -e EULA=TRUE \
            -e TYPE=PAPER \
            -e VERSION=1.21.1 \
            -e ONLINE_MODE=FALSE \
            -e MEMORY=1G \
            -v "$PLUGIN_DIR:/data/plugins" \
            itzg/minecraft-server:java21

          cleanup() {
            docker logs --tail 200 ksl-paper-nbt-integration 2>&1 || true
            docker rm -f ksl-paper-nbt-integration >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          server_ready_attempt=""
          for attempt in $(seq 1 120); do
            if [[ -f "$RESULT_FILE" ]]; then
              break
            fi
            running="$(docker inspect --format='{{.State.Running}}' ksl-paper-nbt-integration 2>/dev/null || true)"
            if [[ "$running" != "true" ]]; then
              echo "Paper exited before the NBT integration plugin wrote its result."
              exit 1
            fi
            server_logs="$(docker logs ksl-paper-nbt-integration 2>&1 || true)"
            if grep -q "Done (" <<< "$server_logs"; then
              if [[ -z "$server_ready_attempt" ]]; then
                server_ready_attempt="$attempt"
              elif (( attempt - server_ready_attempt >= 6 )); then
                echo "Paper became ready, but the NBT integration plugin did not write a result."
                exit 1
              fi
            fi
            sleep 5
          done

          if [[ ! -f "$RESULT_FILE" ]]; then
            echo "Timed out waiting for the real-Paper NBT integration tests."
            exit 1
          fi
          cat "$RESULT_FILE"
          grep -qx "PASS" "$RESULT_FILE"

      - name: Assemble and verify distributable thin JAR
        shell: bash
        run: ./build.sh -Task Package -NoDaemon

      - name: Inspect plugin JAR contents
        shell: bash
        run: ./scripts/inspect-jar.sh

      - name: Upload JAR inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KSL-jar-inspection-${{ github.run_number }}-${{ github.sha }}
          path: build-reports/jar-inspection.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify IntelliJ IDEA companion setup
        run: bash ./gradlew --no-daemon -p ide -PkslJar=../build/libs/KotlinScriptLoader-1.2.2.jar verifyKslIdeSetup

      - name: Generate JAR checksum
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)
          test -n "$JAR"
          sha256sum "$JAR" | tee build/libs/SHA256SUMS

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KSL-build-${{ github.run_number }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
