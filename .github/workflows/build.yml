name: Build
run-name: "KSL build #${{ github.run_number }} · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ksl-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate native Bash tools
        shell: bash
        run: |
          bash -n build.sh scripts/*.sh
          ./build.sh --help
          ./scripts/diagnose-environment.sh --help
          ./scripts/inspect-jar.sh --help

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnose build environment
        shell: bash
        run: ./build.sh -Task Diagnose

      - name: Run strict quality gate
        shell: bash
        run: ./build.sh -Task Quality -NoDaemon -Detailed

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KSL-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: |
            build-reports/
            build/reports/tests/test/
            build/test-results/test/
            build/reports/kover/
            build/reports/quality/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble and verify plugin JAR
        shell: bash
        run: ./build.sh -Task Package -NoDaemon

      - name: Build real-Paper NBT integration test plugin
        run: bash ./gradlew --no-daemon paperIntegrationPluginJar

      - name: Run binary NBT integration tests on Paper 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_DIR="$GITHUB_WORKSPACE/build/paper-integration/plugins"
          RESULT_FILE="$PLUGIN_DIR/KSLNBTIntegration/result.txt"
          mkdir -p "$PLUGIN_DIR"
          cp build/libs/KotlinScriptLoader-1.2.2.jar "$PLUGIN_DIR/KotlinScriptLoader.jar"
          cp build/paper-integration/artifacts/KSLNBTIntegration.jar "$PLUGIN_DIR/KSLNBTIntegration.jar"
          chmod 0777 "$PLUGIN_DIR"

          docker run -d --name ksl-paper-nbt-integration \
            -e EULA=TRUE \
            -e TYPE=PAPER \
            -e VERSION=1.21.1 \
            -e ONLINE_MODE=FALSE \
            -e MEMORY=1G \
            -v "$PLUGIN_DIR:/data/plugins" \
            itzg/minecraft-server:java21

          cleanup() {
            docker logs --tail 200 ksl-paper-nbt-integration 2>&1 || true
            docker rm -f ksl-paper-nbt-integration >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 120); do
            if [[ -f "$RESULT_FILE" ]]; then
              break
            fi
            running="$(docker inspect --format='{{.State.Running}}' ksl-paper-nbt-integration 2>/dev/null || true)"
            if [[ "$running" != "true" ]]; then
              echo "Paper exited before the NBT integration plugin wrote its result."
              exit 1
            fi
            sleep 5
          done

          if [[ ! -f "$RESULT_FILE" ]]; then
            echo "Timed out waiting for the real-Paper NBT integration tests."
            exit 1
          fi
          cat "$RESULT_FILE"
          grep -qx "PASS" "$RESULT_FILE"

      - name: Inspect plugin JAR contents
        shell: bash
        run: ./scripts/inspect-jar.sh

      - name: Upload JAR inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KSL-jar-inspection-${{ github.run_number }}-${{ github.sha }}
          path: build-reports/jar-inspection.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify IntelliJ IDEA companion setup
        run: bash ./gradlew --no-daemon -p ide -PkslJar=../build/libs/KotlinScriptLoader-1.2.2.jar verifyKslIdeSetup

      - name: Generate JAR checksum
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)
          test -n "$JAR"
          sha256sum "$JAR" | tee build/libs/SHA256SUMS

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KSL-build-${{ github.run_number }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
