name: Check KSL Marketplace Worker

on:
  push:
    branches: [main]
    paths: ["marketplace/worker/**"]
  pull_request:
    paths: ["marketplace/worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        working-directory: marketplace/worker
        run: npm run check
