name: Release publishing (disabled during 1.2.2 development)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Explain release status
        run: |
          echo "KSL 1.2.2 is a development build and must not be published yet."
          echo "The last intended public release is 1.2.1."
          echo "Re-enable the release workflow only after an explicit release request."
