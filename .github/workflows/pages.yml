name: Deploy KSL website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_run:
    workflows:
      - Build
      - 'IntelliJ Plugin'
      - 'KSL Compatibility Build · Minecraft 1.16.5–1.21'
      - 'KSL Compatibility Build · Minecraft 1.18+'
    types: [completed]
    branches:
      - main
      - 'compat/mc-1.16.5-1.21'
      - 'compat/mc-1.18-plus'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event.workflow_run.name || github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate static GitHub data
        id: generate-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${headers[@]}" "${api}" -o /tmp/ksl-repo.json
          curl --fail --silent --show-error "${headers[@]}" "${api}/branches?per_page=100" -o /tmp/ksl-branches.json
          curl --fail --silent --show-error "${headers[@]}" "${api}/commits?sha=main&per_page=20" -o /tmp/ksl-commits.json
          release_status=$(curl --silent --show-error "${headers[@]}" "${api}/releases/latest" -o /tmp/ksl-release-response.json -w '%{http_code}')
          if [[ "${release_status}" == "200" ]]; then
            cp /tmp/ksl-release-response.json /tmp/ksl-release.json
          elif [[ "${release_status}" == "404" ]]; then
            printf 'null' > /tmp/ksl-release.json
          else
            echo "GitHub Releases API returned HTTP ${release_status}"
            cat /tmp/ksl-release-response.json
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          api_base = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def api_json(path):
              request = Request(f"{api_base}/{path}", headers=headers)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)


          branches_data = read("/tmp/ksl-branches.json")
          history_limit = 40
          summaries_by_branch = {}
          for branch_item in branches_data:
              branch_name = branch_item["name"]
              query = urlencode({"sha": branch_name, "per_page": history_limit})
              summaries_by_branch[branch_name] = api_json(f"commits?{query}")

          def enrich_commit(pair):
              branch_name, summary = pair
              payload = api_json(f"commits/{summary['sha']}")
              commit_data = payload.get("commit") or {}
              author_data = commit_data.get("author") or {}
              committer_data = commit_data.get("committer") or {}
              stats = payload.get("stats") or {}
              files = payload.get("files") or []
              return branch_name, {
                  "sha": payload.get("sha") or summary.get("sha"),
                  "html_url": payload.get("html_url") or summary.get("html_url"),
                  "message": commit_data.get("message") or "",
                  "author_name": author_data.get("name") or (payload.get("author") or {}).get("login") or "Unknown",
                  "author_login": (payload.get("author") or {}).get("login") or "",
                  "date": author_data.get("date") or committer_data.get("date") or "",
                  "additions": stats.get("additions"),
                  "deletions": stats.get("deletions"),
                  "total": stats.get("total"),
                  "changed_files": len(files),
                  "tree_sha": (commit_data.get("tree") or {}).get("sha"),
                  "files": [
                      {
                          "filename": item.get("filename"),
                          "status": item.get("status"),
                          "additions": item.get("additions", 0),
                          "deletions": item.get("deletions", 0),
                          "changes": item.get("changes", 0),
                      }
                      for item in files
                  ],
              }

          history_branches = {branch_name: [] for branch_name in summaries_by_branch}
          commit_tasks = [
              (branch_name, summary)
              for branch_name, summaries in summaries_by_branch.items()
              for summary in summaries
          ]
          with ThreadPoolExecutor(max_workers=8) as executor:
              for branch_name, commit_data in executor.map(enrich_commit, commit_tasks):
                  history_branches[branch_name].append(commit_data)

          source_branches = {}
          for branch_name, commits in history_branches.items():
              head_tree_sha = commits[0].get("tree_sha") if commits else None
              if not head_tree_sha:
                  source_branches[branch_name] = {"truncated": False, "entries": []}
                  continue
              tree_data = api_json(f"git/trees/{head_tree_sha}?recursive=1")
              source_branches[branch_name] = {
                  "truncated": tree_data.get("truncated", False),
                  "entries": [
                      {
                          "path": item.get("path"),
                          "type": item.get("type"),
                          "size": item.get("size", 0),
                          "sha": item.get("sha"),
                      }
                      for item in tree_data.get("tree", [])
                      if item.get("type") in ("blob", "tree", "commit")
                  ],
              }

          Path("website/history.json").write_text(
              json.dumps(
                  {
                      "generated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
                      "limit_per_branch": history_limit,
                      "branches": history_branches,
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )
          Path("website/source-tree.json").write_text(
              json.dumps(
                  {
                      "generated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
                      "branches": source_branches,
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )

          build_specs = {
              "main": ("KSL-build-", "main"),
              "compat/mc-1.16.5-1.21": ("KSL-compat-1.16.5-1.21-", "compat116"),
              "compat/mc-1.18-plus": ("KSL-compat-1.18-plus-", "compat118"),
          }

          def latest_build(branch, artifact_prefix):
              query = urlencode({"branch": branch, "per_page": 50})
              runs = api_json(f"actions/runs?{query}").get("workflow_runs", [])
              runs = [
                  run for run in runs
                  if run.get("path") == ".github/workflows/build.yml"
                  and run.get("conclusion") == "success"
              ]
              if not runs:
                  return None

              latest_run = runs[0]
              selected_run = latest_run
              selected_artifact = None
              for run in runs:
                  artifacts = api_json(
                      f"actions/runs/{run['id']}/artifacts?per_page=100"
                  ).get("artifacts", [])
                  artifact = next((
                      item for item in artifacts
                      if item.get("name", "").startswith(artifact_prefix)
                      and "diagnostics" not in item.get("name", "").lower()
                      and not item.get("expired", False)
                  ), None)
                  if artifact:
                      selected_run = run
                      selected_artifact = artifact
                      break

              result = {
                  "run_id": selected_run["id"],
                  "run_number": selected_run.get("run_number"),
                  "name": selected_run.get("name"),
                  "branch": branch,
                  "sha": selected_run.get("head_sha"),
                  "created_at": selected_run.get("created_at"),
                  "html_url": selected_run.get("html_url"),
                  "artifact": None,
              }
              if selected_artifact:
                  result["artifact"] = {
                      "id": selected_artifact["id"],
                      "name": selected_artifact.get("name"),
                      "size_in_bytes": selected_artifact.get("size_in_bytes"),
                      "created_at": selected_artifact.get("created_at"),
                      "expires_at": selected_artifact.get("expires_at"),
                      "expired": selected_artifact.get("expired", False),
                  }
              return result

          def latest_ide_plugin():
              query = urlencode({"branch": "main", "per_page": 50})
              runs = api_json(f"actions/runs?{query}").get("workflow_runs", [])
              runs = [
                  run for run in runs
                  if run.get("path") == ".github/workflows/ide-plugin.yml"
                  and run.get("conclusion") == "success"
              ]
              for run in runs:
                  artifacts = api_json(f"actions/runs/{run['id']}/artifacts?per_page=100").get("artifacts", [])
                  artifact = next((
                      item for item in artifacts
                      if item.get("name", "").startswith("KSL-IntelliJ-Plugin-")
                      and not item.get("expired", False)
                  ), None)
                  if artifact:
                      return {
                          "run_id": run["id"], "run_number": run.get("run_number"),
                          "sha": run.get("head_sha"), "created_at": run.get("created_at"),
                          "html_url": run.get("html_url"), "version": "1.2.0",
                          "artifact": {"id": artifact["id"], "name": artifact.get("name"),
                                       "size_in_bytes": artifact.get("size_in_bytes"),
                                       "expired": artifact.get("expired", False)},
                      }
              return None

          data = {
              "repo": read("/tmp/ksl-repo.json"),
              "branches": read("/tmp/ksl-branches.json"),
              "release": read("/tmp/ksl-release.json"),
              "commits": read("/tmp/ksl-commits.json"),
              "builds": {
                  branch: latest_build(branch, spec[0])
                  for branch, spec in build_specs.items()
              },
              "ide_plugin": latest_ide_plugin(),
          }
          assert isinstance(data["branches"], list) and data["branches"], "No repository branches returned"
          assert isinstance(data["commits"], list) and data["commits"], "No main-branch commits returned"
          Path("website/data.json").write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for branch, (_, output_key) in build_specs.items():
                  build = data["builds"].get(branch)
                  artifact = build.get("artifact") if build else None
                  if build and artifact:
                      output.write(f"{output_key}_run_id={build['run_id']}\n")
                      output.write(f"{output_key}_artifact_name={artifact['name']}\n")
              ide_plugin = data.get("ide_plugin")
              if ide_plugin and ide_plugin.get("artifact"):
                  output.write(f"ide_plugin_run_id={ide_plugin['run_id']}\n")
                  output.write(f"ide_plugin_artifact_name={ide_plugin['artifact']['name']}\n")

          for branch, build in data["builds"].items():
              artifact_name = build["artifact"]["name"] if build and build["artifact"] else "none"
              print(f"Latest successful build for {branch}: {build['run_number'] if build else 'none'}; artifact={artifact_name}")
          print(f"Generated website/data.json: {len(data['branches'])} branches, {len(data['commits'])} commits, release={bool(data['release'])}")
          PY
      - name: Download latest main build artifact
        if: steps.generate-data.outputs.main_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.generate-data.outputs.main_artifact_name }}
          path: /tmp/ksl-artifacts/main
          run-id: ${{ steps.generate-data.outputs.main_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download latest Minecraft 1.16.5–1.21 artifact
        if: steps.generate-data.outputs.compat116_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.generate-data.outputs.compat116_artifact_name }}
          path: /tmp/ksl-artifacts/compat116
          run-id: ${{ steps.generate-data.outputs.compat116_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download latest Minecraft 1.18+ artifact
        if: steps.generate-data.outputs.compat118_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.generate-data.outputs.compat118_artifact_name }}
          path: /tmp/ksl-artifacts/compat118
          run-id: ${{ steps.generate-data.outputs.compat118_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download latest IntelliJ plugin artifact
        if: steps.generate-data.outputs.ide_plugin_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.generate-data.outputs.ide_plugin_artifact_name }}
          path: /tmp/ksl-artifacts/ide-plugin
          run-id: ${{ steps.generate-data.outputs.ide_plugin_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Publish JAR files and IntelliJ plugin ZIP
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          data_path = Path("website/data.json")
          data = json.loads(data_path.read_text(encoding="utf-8"))
          download_dir = Path("website/downloads")
          download_dir.mkdir(parents=True, exist_ok=True)
          specs = {
              "main": "main",
              "compat/mc-1.16.5-1.21": "compat116",
              "compat/mc-1.18-plus": "compat118",
          }

          for branch, folder in specs.items():
              build = data["builds"].get(branch)
              if not build or not build.get("artifact"):
                  continue

              artifact_dir = Path("/tmp/ksl-artifacts") / folder
              jars = [
                  path for path in artifact_dir.rglob("*.jar")
                  if not path.name.lower().endswith(("-sources.jar", "-javadoc.jar"))
              ]
              if not jars:
                  raise SystemExit(f"No plugin JAR found in downloaded artifact for {branch}")

              jar = sorted(jars, key=lambda path: ("/libs/" not in path.as_posix(), path.name))[0]
              content = jar.read_bytes()
              filename = f"KSL-{folder}-build-{build['run_number']}-{jar.name}"
              destination = download_dir / filename
              destination.write_bytes(content)
              digest = hashlib.sha256(content).hexdigest()
              checksum = destination.with_suffix(destination.suffix + ".sha256")
              checksum.write_text(f"{digest}  {filename}\n", encoding="utf-8")

              build["artifact"].update({
                  "jar_name": jar.name,
                  "jar_size_in_bytes": len(content),
                  "sha256": digest,
                  "site_download_url": f"./downloads/{filename}",
                  "checksum_url": f"./downloads/{filename}.sha256",
              })
              print(f"Published {branch}: {filename} ({len(content)} bytes), SHA-256 {digest}")

          ide_plugin = data.get("ide_plugin")
          if ide_plugin and ide_plugin.get("artifact"):
              plugin_dir = Path("/tmp/ksl-artifacts/ide-plugin")
              archives = sorted(plugin_dir.rglob("*.zip"))
              if not archives:
                  raise SystemExit("No IntelliJ plugin ZIP found in downloaded artifact")
              archive = archives[0]
              content = archive.read_bytes()
              filename = f"KSL-IntelliJ-Plugin-build-{ide_plugin['run_number']}.zip"
              destination = download_dir / filename
              destination.write_bytes(content)
              digest = hashlib.sha256(content).hexdigest()
              checksum = destination.with_suffix(destination.suffix + ".sha256")
              checksum.write_text(f"{digest}  {filename}\n", encoding="utf-8")
              ide_plugin.update({
                  "size_in_bytes": len(content), "sha256": digest,
                  "site_download_url": f"./downloads/{filename}",
                  "checksum_url": f"./downloads/{filename}.sha256",
              })
              print(f"Published IntelliJ plugin: {filename} ({len(content)} bytes), SHA-256 {digest}")

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
      - name: Refresh website assets
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for page in Path("website").glob("*.html"):
              source = page.read_text(encoding="utf-8")
              source = re.sub(r'(assets/(?:app\.js|style\.css)\?v=)[^"&]+', r'\g<1>20261116-8', source)
              page.write_text(source, encoding="utf-8")
          PY
          node --check website/assets/app.js
      - name: Validate website
        shell: bash
        run: |
          test -s website/index.html
          test -s website/about.html
          test -s website/branches.html
          test -s website/download.html
          test -s website/development.html
          test -s website/docs.html
          test -s website/source.html
          test -s website/changelog.html
          test -s website/assets/style.css
          test -s website/assets/app.js
          test -s website/data.json
          test -s website/history.json
          test -s website/source-tree.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
