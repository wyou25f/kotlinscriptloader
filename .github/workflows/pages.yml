name: Deploy KSL website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Snapshot recent commit history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?sha=main&per_page=20" \
            -o website/commits.json
          python -c "import json; data=json.load(open('website/commits.json')); assert isinstance(data, list) and data, 'Commit history is empty'"
      - name: Validate website
        shell: bash
        run: |
          test -s website/index.html
          test -s website/about.html
          test -s website/branches.html
          test -s website/download.html
          test -s website/docs.html
          test -s website/source.html
          test -s website/changelog.html
          test -s website/assets/style.css
          test -s website/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
