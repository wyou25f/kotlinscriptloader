name: Deploy KSL website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate website
        shell: bash
        run: |
          test -s website/index.html
          test -s website/about.html
          test -s website/branches.html
          test -s website/download.html
          test -s website/docs.html
          test -s website/source.html
          test -s website/changelog.html
          test -s website/assets/style.css
          test -s website/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
